configs:
  ca_rag_config.yaml:
    context_manager:
      functions:
      - summarization
      - ingestion_function
      - retriever_function
      - notification
    functions:
      ingestion_function:
        params:
          batch_size: 1
          cot: false
          image: false
          top_k: 5
        tools:
          db: graph_db
          llm: chat_llm
        type: graph_ingestion
      notification:
        params:
          events: []
        tools:
          llm: notification_llm
          notification_tool: notification_tool
        type: notification
      retriever_function:
        params:
          batch_size: 1
          cot: false
          image: false
          top_k: 5
        tools:
          db: graph_db
          llm: chat_llm
        type: graph_retrieval
      summarization:
        params:
          batch_max_concurrency: 20
          batch_size: 5
          prompts:
            caption: Write a concise and clear dense caption for the provided warehouse
              video, focusing on irregular or hazardous events such as boxes falling,
              workers not wearing PPE, workers falling, workers taking photographs,
              workers chitchatting, forklift stuck, etc. Start and end each sentence
              with a time stamp.
            caption_summarization: 'You should summarize the following events of a
              warehouse in the format start_time:end_time:caption. For start_time
              and end_time use . to seperate seconds, minutes, hours. If during a
              time segment only regular activities happen, then ignore them, else
              note any irregular activities in detail. The output should be bullet
              points in the format start_time:end_time: detailed_event_description.
              Don''t return anything else except the bullet points.'
            summary_aggregation: 'You are a warehouse monitoring system. Given the
              caption in the form start_time:end_time: caption, Aggregate the following
              captions in the format start_time:end_time:event_description. If the
              event_description is the same as another event_description, aggregate
              the captions in the format start_time1:end_time1,...,start_timek:end_timek:event_description.
              If any two adjacent end_time1 and start_time2 is within a few tenths
              of a second, merge the captions in the format start_time1:end_time2.
              The output should only contain bullet points.  Cluster the output into
              Unsafe Behavior, Operational Inefficiencies, Potential Equipment Damage
              and Unauthorized Personnel'
        tools:
          db: graph_db
          llm: summarization_llm
        type: batch_summarization
    tools:
      chat_llm:
        params:
          base_url: http://$egress.llm-openai-api.address:$egress.llm-openai-api.port/v1
          max_tokens: 2048
          model: ${LLM_MODEL}
          temperature: 0.2
          top_p: 0.7
        type: llm
      graph_db:
        params:
          host: ${GRAPH_DB_HOST}
          password: ${GRAPH_DB_PASSWORD}
          port: ${GRAPH_DB_PORT}
          username: ${GRAPH_DB_USERNAME}
        tools:
          embedding: nvidia_embedding
        type: neo4j
      notification_llm:
        params:
          base_url: http://$egress.llm-openai-api.address:$egress.llm-openai-api.port/v1
          max_tokens: 2048
          model: ${LLM_MODEL}
          temperature: 0.2
          top_p: 0.7
        type: llm
      notification_tool:
        params:
          endpoint: http://127.0.0.1:60000/via-alert-callback
        type: alert_sse_notifier
      nvidia_embedding:
        params:
          base_url: http://$egress.nemo-embed.address:$egress.nemo-embed.port/v1
          model: nvidia/llama-3.2-nv-embedqa-1b-v2
        type: embedding
      nvidia_reranker:
        params:
          base_url: http://$egress.nemo-rerank.address:$egress.nemo-rerank.port/v1
          model: nvidia/llama-3.2-nv-rerankqa-1b-v2
        type: reranker
      summarization_llm:
        params:
          base_url: http://$egress.llm-openai-api.address:$egress.llm-openai-api.port/v1
          max_tokens: 2048
          model: ${LLM_MODEL}
          temperature: 0.2
          top_p: 0.7
        type: llm
      vector_db:
        params:
          host: ${MILVUS_DB_HOST}
          port: ${MILVUS_DB_PORT}
        tools:
          embedding: nvidia_embedding
        type: milvus
