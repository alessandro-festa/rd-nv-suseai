Component:
  app-version: 2.1.0
  description: default description
  helmUrlLocationPath: https://helm.ngc.nvidia.com/myorg/myteam/charts
  name: minio
  version: 2.1.0
affinity: {}
applicationSpecs:
  minio-deployment:
    apptype: stateless
    containers:
      minio-container:
        args:
        - server
        - /data
        - --address
        - :9000
        - --console-address
        - :9001
        command:
        - minio
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              key: access-key
              name: minio-creds-secret
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: minio-creds-secret
        image:
          repository: minio/minio
          tag: RELEASE.2025-09-07T16-13-09Z
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /minio/health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 20
        ports:
        - containerPort: 9001
          name: http-console
        - containerPort: 9000
          name: http
    services:
      minio-service:
        ports:
        - name: http-api-console
          port: 9001
        - name: http-api
          port: 9000
defaultVolumeMounts:
- mountPath: /opt/workload-config
  name: workload-cm-volume
- mountPath: /opt/configs
  name: configs-volume
- mountPath: /opt/scripts
  name: scripts-cm-volume
defaultVolumes:
- configMap:
    name: minio-workload-cm
  name: workload-cm-volume
- configMap:
    name: minio-configs-cm
  name: configs-volume
- configMap:
    name: minio-scripts-cm
  name: scripts-cm-volume
egress: {}
externalFiles: []
image:
  pullPolicy: IfNotPresent
imagePullSecrets: []
ingress:
  enabled: false
metrics: {}
nodeSelector: {}
podAnnotations: {}
podSecurityContext: {}
replicaCount: 1
resources: {}
securityContext: {}
storageClaims: {}
tolerations: []
workloadSpecs:
  dummy: {}



configs:
  config.yaml:
    SampleConfig:
      sampleValue: 0

